<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Namrata Creates Art - Scratch Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card-container {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 360px;
      width: 100%;
      position: relative;
    }

    h1 {
      color: #8e24aa;
      font-size: 24px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .scratch-area {
      position: relative;
      width: 280px;
      height: 160px;
      margin: 0 auto 20px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
    }

    .reward {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #fff8e1;
      border: 2px dashed #ffb300;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .reward-title {
      color: #e65100;
      font-size: 22px;
      font-weight: bold;
    }

    .reward-desc {
      color: #555;
      font-size: 14px;
      margin-top: 5px;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      touch-action: none;
    }

    .expiry {
      font-size: 12px;
      color: #888;
      font-weight: 500;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <div class="card-container">
    <h1>Namrata Creates Art</h1>
    <p class="subtitle">Scratch below to reveal your offer!</p>

    <div class="scratch-area">
      <div class="reward">
        <div class="reward-title">FLAT 10% OFF</div>
        <div class="reward-desc">On orders above ₹200</div>
      </div>
      <canvas id="scratch-canvas" width="280" height="160"></canvas>
    </div>

    <div class="expiry">Valid till: 31/10/2026</div>
  </div>

  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const canvas = document.getElementById('scratch-canvas');
    const ctx = canvas.getContext('2d');
    let isDrawing = false;
    let revealed = false;

    // Draw scratch layer
    function initScratchLayer() {
      ctx.fillStyle = '#b0bec5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Text on scratch card
      ctx.fillStyle = '#37474f';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Scratch Here!', canvas.width / 2, canvas.height / 2 + 5);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function scratch(e) {
      if (!isDrawing || revealed) return;
      e.preventDefault();
      
      const pos = getPos(e);
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 20, 0, Math.PI * 2);
      ctx.fill();

      checkScratchPercentage();
    }

    function checkScratchPercentage() {
      if (revealed) return;

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = imageData.data;
      let clearPixels = 0;

      for (let i = 3; i < pixels.length; i += 4) {
        if (pixels[i] === 0) {
          clearPixels++;
        }
      }

      const percentage = (clearPixels / (pixels.length / 4)) * 100;

      if (percentage > 45) {
        revealed = true;
        canvas.style.transition = 'opacity 0.5s ease';
        canvas.style.opacity = '0';
        setTimeout(() => {
          canvas.style.display = 'none';
        }, 500);

        triggerConfetti();
      }
    }

    function triggerConfetti() {
      const myConfetti = confetti.create(document.getElementById('confetti-canvas'), {
        resize: true,
        useWorker: true
      });

      myConfetti({
        particleCount: 120,
        spread: 80,
        origin: { y: 0.6 }
      });
    }

    // Event Listeners
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('mousemove', scratch);
    canvas.addEventListener('mouseup', () => isDrawing = false);
    canvas.addEventListener('mouseleave', () => isDrawing = false);

    canvas.addEventListener('touchstart', (e) => { isDrawing = true; scratch(e); });
    canvas.addEventListener('touchmove', scratch);
    canvas.addEventListener('touchend', () => isDrawing = false);

    initScratchLayer();
  </script>
</body>
</html>
